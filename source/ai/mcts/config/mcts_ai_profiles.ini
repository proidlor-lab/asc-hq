# ===== Custom Profiles =====
# Add your own profiles below

[custom_blitz]
# Very fast AI for testing or weak opponents
maxIterations=50
maxTimeMs=500
rolloutDepthLimit=3
explorationConstant=1.414
materialWeight=2.0
positionWeight=0.5
healthWeight=1.0
threatWeight=1.0
enableLogging=true

[custom_cautious]
# Extremely defensive, avoids all risks
maxIterations=300
maxTimeMs=3000
rolloutDepthLimit=15
explorationConstant=1.0
materialWeight=1.0
positionWeight=2.0
healthWeight=3.0
threatWeight=4.0

[custom_experimental]
# High exploration for discovering new strategies
maxIterations=200
maxTimeMs=2000
rolloutDepthLimit=10
explorationConstant=2.5
materialWeight=1.5
positionWeight=1.5
healthWeight=1.5
threatWeight=1.5
