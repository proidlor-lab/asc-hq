# MCTS AI Configuration Profiles
#
# This file defines custom MCTS AI configurations.
# Each section defines a profile that can be selected in-game.
#
# Format:
# [profile_name]
# parameter=value
#
# Available parameters:
# - maxIterations: Maximum MCTS iterations per decision (default: 200)
# - maxTimeMs: Maximum time in milliseconds per decision (default: 2000)
# - rolloutDepthLimit: Maximum depth for rollout simulations (default: 10)
# - explorationConstant: UCB1 exploration constant (default: 1.414)
# - earlyTerminationThreshold: Confidence threshold for early stop (default: 0.95)
# - materialWeight: Weight for material evaluation (default: 2.0)
# - positionWeight: Weight for position evaluation (default: 1.0)
# - healthWeight: Weight for health evaluation (default: 1.5)
# - threatWeight: Weight for threat evaluation (default: 1.2)
# - enableLogging: Enable AI logging (default: false)
# - enableDebugOutput: Enable debug output (default: false)

# ===== Built-in Profiles =====
# These are provided by default and can be overridden here

[balanced]
maxIterations=200
maxTimeMs=2000
rolloutDepthLimit=10
explorationConstant=1.414
earlyTerminationThreshold=0.95
materialWeight=2.0
positionWeight=1.0
healthWeight=1.5
threatWeight=1.2

[aggressive]
maxIterations=250
maxTimeMs=2000
rolloutDepthLimit=10
explorationConstant=1.414
earlyTerminationThreshold=0.95
materialWeight=3.0
positionWeight=0.5
healthWeight=1.5
threatWeight=0.8

[defensive]
maxIterations=200
maxTimeMs=2000
rolloutDepthLimit=10
explorationConstant=1.414
earlyTerminationThreshold=0.95
materialWeight=1.5
positionWeight=1.5
healthWeight=2.0
threatWeight=2.5

[fast]
